<script>
    let currentHomeBlog = 1;

    const homeBlogTitle = document.getElementById("homeBlogTitle");
    const homeBlogText = document.getElementById("homeBlogText");

    function switchHomeBlog() {
        if (currentHomeBlog === 1) {
            currentHomeBlog = 2;

            homeBlogTitle.textContent = "Hoe ik projecten aanpak";
            homeBlogText.textContent =
                "Ga naar blog voor meer!";
        } else {
            currentHomeBlog = 1;

            homeBlogTitle.textContent = "Waarom ik hbo‑ICT heb gekozen";
            homeBlogText.textContent =
                "Ga naar blog voor meer!";
        }
    }

    setInterval(switchHomeBlog, 4000); //AI//
